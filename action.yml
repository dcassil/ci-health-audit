name: "ci-health-audit"
description: >
  Run ci-health-audit (scan or gate mode) in a consumer repository.
  Installs scc, runs the published npm package via npx, and reports the
  health score as a job summary and step output. dependency-cruiser ships
  as a dependency of the package, so no separate install is required.

inputs:
  config:
    description: "Path to the ci-health-audit config file."
    required: false
    default: "./ci-health-audit.config.json"
  mode:
    description: "Run mode: 'scan' (report only) or 'gate' (fail on regression)."
    required: false
    default: "scan"
  working-directory:
    description: "Working directory for the audit (the repo root being scanned)."
    required: false
    default: "."
  node-version:
    description: "Node.js version to use."
    required: false
    default: "20"
  version:
    description: "ci-health-audit npm version to run (e.g. 'latest' or '0.1.1')."
    required: false
    default: "latest"
  scc-version:
    description: "scc version to install (semver tag without leading v)."
    required: false
    default: "3.5.0"
  fail-on-regression:
    description: "When mode=gate, exit 1 on regression (passed through to the CLI)."
    required: false
    default: "true"

outputs:
  score:
    description: "Numeric overall health score (0–10) produced by the audit."
    value: ${{ steps.capture.outputs.score }}

runs:
  using: "composite"
  steps:
    # ── 1. Node.js ──────────────────────────────────────────────────────────
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    # ── 2. Install scc (Go binary, from GitHub Releases) ────────────────────
    - name: Install scc
      shell: bash
      run: |
        SCC_VERSION="${{ inputs.scc-version }}"
        OS="$(uname -s | tr '[:upper:]' '[:lower:]')"
        ARCH="$(uname -m)"
        case "$ARCH" in
          x86_64)  ARCH="amd64" ;;
          aarch64) ARCH="arm64" ;;
          arm64)   ARCH="arm64" ;;
        esac
        URL="https://github.com/boyter/scc/releases/download/v${SCC_VERSION}/scc_Linux_${ARCH}.tar.gz"
        curl -fsSL "$URL" -o /tmp/scc.tar.gz
        tar -xzf /tmp/scc.tar.gz -C /tmp scc
        sudo mv /tmp/scc /usr/local/bin/scc
        scc --version

    # ── 3. Run the published package via npx and capture JSON output ────────
    #    dependency-cruiser is bundled as a dependency of ci-health-audit, so
    #    npx puts both the CLI and `depcruise` on PATH — no separate install.
    - name: Run ci-health-audit (${{ inputs.mode }})
      id: capture
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CIHA_MODE: ${{ inputs.mode }}
        CIHA_CONFIG: ${{ inputs.config }}
        CIHA_VERSION: ${{ inputs.version }}
      run: |
        set +e
        JSON_OUT=$(npx --yes "ci-health-audit@${CIHA_VERSION}" \
          "$CIHA_MODE" \
          --config "$CIHA_CONFIG" \
          --json 2>&1)
        EXIT_CODE=$?
        set -e

        # Extract score from JSON output
        SCORE=$(echo "$JSON_OUT" | python3 -c \
          "import sys,json; d=json.load(sys.stdin); print(d.get('score', d.get('overall', '')))" \
          2>/dev/null || echo "")

        # Emit GitHub output
        echo "score=${SCORE}" >> "$GITHUB_OUTPUT"

        # Write job summary (human-readable)
        {
          echo "## ci-health-audit — ${CIHA_MODE} results"
          echo ""
          echo "| Field | Value |"
          echo "|-------|-------|"
          echo "| **Overall score** | ${SCORE} |"
          echo "| **Config** | \`${CIHA_CONFIG}\` |"
          echo "| **Mode** | ${CIHA_MODE} |"
          echo ""
          echo "<details><summary>Full JSON output</summary>"
          echo ""
          echo '```json'
          echo "$JSON_OUT"
          echo '```'
          echo ""
          echo "</details>"
        } >> "$GITHUB_STEP_SUMMARY"

        # Honour fail-on-regression for gate mode
        if [ "$CIHA_MODE" = "gate" ] && [ "${{ inputs.fail-on-regression }}" = "true" ]; then
          exit $EXIT_CODE
        fi
